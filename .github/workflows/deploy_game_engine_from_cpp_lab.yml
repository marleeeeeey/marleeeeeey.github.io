name: Deploy "GameEngine" from "cpp_lab"
description: Build "GameEngine" target from "cpp_lab" repo and deploy here in "https://marleeeeeey.github.io"
on:
  workflow_dispatch:
    permissions:
      contents: write

jobs:


  build-from-cpp-lab:
    name: Build "GameEngine" target from "cpp_lab" repo
    uses: marleeeeeey/cpp_lab/.github/workflows/cpp_lab_web_build.yml@main
    secrets: inherit


  deploy:
    name: Deploy "GameEngine" to "https://marleeeeeey.github.io"
    needs: build-from-cpp-lab
    runs-on: ubuntu-latest

    steps:

      - name: Download "GameEngine_itch_web.zip"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cpp_lab_web_build_artifact
          path: cpp_lab_web_build_artifact
        # Log:
        # Starting download of artifact to: /home/runner/work/marleeeeeey.github.io/marleeeeeey.github.io/cpp_lab_web_build_artifact

      - name: Unzip "GameEngine_itch_web.zip"
        run: |
          mkdir -p web_build
          unzip cpp_lab_web_build_artifact/GameEngine_itch_web.zip -d web_build
        # Log:
        # Archive:  cpp_lab_web_build_artifact/GameEngine_itch_web.zip
        #   inflating: web_build/GameEngine.wasm
        #   inflating: web_build/index.html
        #   inflating: web_build/GameEngine.js
        #   inflating: web_build/GameEngine.data

      - name: Deploy as Commit to Branch "gh-pages"
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web_build
